{% extends "accounts/base.html" %}
{% block content %}
<div class="card" style="max-width:600px">
    <h2>Dashboard</h2>
    <p class="welcome">Hello, <strong>{{ user.username }}</strong></p>
    <span class="badge">{{ user.role }}</span>

    <div style="display:flex;gap:10px;margin:16px 0;flex-wrap:wrap">
        <a href="{% url 'create_meeting' %}" 
           style="padding:10px 18px;background:#2563eb;color:white;border-radius:8px;text-decoration:none;font-size:14px;font-weight:500">
            + Start Meeting
        </a>
        <a href="{% url 'join_meeting' %}"
           style="padding:10px 18px;border:1px solid #ddd;border-radius:8px;text-decoration:none;font-size:14px;color:#333">
            Join with Code
        </a>
    </div>

    <hr style="border:none;border-top:1px solid #eee;margin:16px 0">
    <p style="font-size:13px;color:#888">Video call, chat, transcription and AI features coming soon.</p>
    <a href="{% url 'logout' %}" class="nav-link">Log out</a>
</div>
{% endblock %}
