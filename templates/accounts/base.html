<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        h2 { margin-bottom: 1.5rem; font-size: 1.4rem; color: #1a1a1a; }
        input, select { width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .link { text-align: center; margin-top: 1rem; font-size: 13px; color: #555; }
        .link a { color: #2563eb; text-decoration: none; }
        .error { color: red; font-size: 13px; margin-bottom: 8px; }
        .welcome { font-size: 1rem; color: #444; margin-bottom: 1rem; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; background: #dbeafe; color: #1d4ed8; margin-bottom: 1rem; }
        .nav-link { display: inline-block; margin-top: 1rem; color: #2563eb; font-size: 14px; text-decoration: none; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
