{% extends "accounts/base.html" %}
{% block content %}
<div class="card">
    <h2>Create your account</h2>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            {% if field.errors %}
                <div class="error">{{ field.errors }}</div>
            {% endif %}
            {{ field }}
        {% endfor %}
        <button type="submit">Sign up</button>
    </form>
    <div class="link">Already have an account? <a href="{% url 'login' %}">Log in</a></div>
</div>
{% endblock %}
