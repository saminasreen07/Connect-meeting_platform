{% extends "accounts/base.html" %}
{% block content %}
<div class="card">
    <h2>Start a new meeting</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" placeholder="Meeting title (optional)" />
        <button type="submit">Create & Join Room</button>
    </form>
    <div class="link"><a href="{% url 'dashboard' %}">← Back to dashboard</a></div>
</div>
{% endblock %}
